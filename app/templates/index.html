<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tree Detector</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  canvas {
    border: 1px solid #ccc;
    margin-top: 10px;
  }
  table {
    border-collapse: collapse;
    margin-top: 20px;
    width: 100%;
  }
  table, th, td {
    border: 1px solid #aaa;
  }
  th, td {
    padding: 8px;
    text-align: left;
  }
  .color-box {
    width: 15px;
    height: 15px;
    display: inline-block;
    margin-right: 5px;
    vertical-align: middle;
  }
  canvas {
    border: 1px solid #ccc;
    margin-top: 10px;
    max-width: 90%;   /* ограничение ширины */
    max-height: 500px; /* ограничение высоты */
  }

</style>
</head>
<body>
<h2>Tree Detector</h2>
<input type="file" id="fileInput" accept="image/*">
<button id="uploadBtn">Загрузить и распознать</button>
<div id="status" style="margin-top:10px;"></div>

<canvas id="canvas"></canvas>

<table id="treeTable">
  <thead>
    <tr>
      <th>Цвет</th>
      <th>Тип</th>
      <th>Порода</th>
      <th>Состояние</th>
      <th>% сухости</th>
      <th>Артефакты</th>
      <th>Описание</th>
      <th>Сезон</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const treeTableBody = document.querySelector('#treeTable tbody');
const statusDiv = document.getElementById('status');

// Генерируем случайный цвет
function getRandomColor() {
  return '#ff55cc'
  const letters = '0123456789ABCDEF';
  let color = '#';
  for (let i = 0; i < 6; i++) {
    color += letters[Math.floor(Math.random() * 16)];
  }
  return color;
}

uploadBtn.addEventListener('click', async () => {
  if (!fileInput.files.length) return alert('Выберите файл!');

  statusDiv.textContent = 'Обработка...';  // показываем текст

  const file = fileInput.files[0];
  const formData = new FormData();
  formData.append('file', file);

  const response = await fetch('/api/predict/', {
    method: 'POST',
    body: formData
  });

  const data = await response.json();

  // после получения результата убираем статус
  statusDiv.textContent = '';

  // остальной код без изменений
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    treeTableBody.innerHTML = '';
    
    if (!data.trees.length) {
      alert('Подходящих деревьев не обнаружено')
    }

    data.trees.forEach(tree => {
      const [x1, y1, x2, y2] = tree.bbox;
      const color = getRandomColor();
      ctx.strokeStyle = color;
      ctx.lineWidth = 10;
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="color-box" style="background:${color}"></span></td>
        <td>${tree.type}</td>
        <td>${tree.breed}</td>
        <td>${tree.condition}</td>
        <td>${tree.percentage_dried}%</td>
        <td>${tree.artifacts.join(', ')}</td>
        <td>${tree.description}</td>
        <td>${tree.season}</td>
      `;
      treeTableBody.appendChild(tr);
    });
  };
  img.src = data.photo_url;
});

</script>
</body>
</html>
